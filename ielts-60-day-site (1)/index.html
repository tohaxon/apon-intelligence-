const V=[["sentence","noun","/ˈsen.təns/","বাক্য","A group of words that gives a complete idea.","Every sentence needs a subject and a verb.","write a sentence; complete sentence","Education"],["subject","noun","/ˈsʌb.dʒekt/","কর্তা","The person or thing that does the action.","The subject of the sentence is “the teacher”.","subject of a sentence","Education"],["verb","noun","/vɜːb/","ক্রিয়া","A word that shows an action or state.","“Write” is a verb.","main verb; action verb","Education"],["object","noun","/ˈɒb.dʒekt/","কর্ম","The person or thing that receives the action.","In “She reads a book”, the object is “a book”.","direct object","Education"],["structure","noun","/ˈstrʌk.tʃər/","কাঠামো","The way parts are arranged.","Good essays have a clear structure.","sentence structure; clear structure","General academic"],["accurate","adjective","/ˈæk.jə.rət/","নির্ভুল","Correct and exact.","Use accurate data in Task 1.","accurate information","General academic"],["statement","noun","/ˈsteɪt.mənt/","বিবৃতি","Something said or written as a fact or opinion.","This statement is true.","make a statement","General academic"],["pattern","noun","/ˈpæt.ən/","ধরন, নকশা","A regular way something is done or arranged.","S + V + O is a basic English pattern.","sentence pattern; follow a pattern","General academic"],["adjective","noun","/ˈædʒ.ɪk.tɪv/","বিশেষণ","A word that describes a noun.","“Beautiful” is an adjective.","descriptive adjective","Education"],["adverb","noun","/ˈæd.vɜːb/","ক্রিয়াবিশেষণ","A word that describes a verb, an adjective or another adverb.","“Quickly” is an adverb.","adverb of manner","Education"],["preposition","noun","/ˌprep.əˈzɪʃ.ən/","পদান্বয়ী অব্যয়","A word that shows place, time or direction.","“In” is a preposition.","preposition of place","Education"],["conjunction","noun","/kənˈdʒʌŋk.ʃən/","সংযোজক অব্যয়","A word that joins words or ideas.","“But” is a conjunction.","coordinating conjunction","Education"],["pronoun","noun","/ˈprəʊ.naʊn/","সর্বনাম","A word used instead of a noun.","“She” is a pronoun.","personal pronoun","Education"],["category","noun","/ˈkæt.ə.ɡər.i/","শ্রেণি","A group of similar things.","Words belong to different categories.","main category","General academic"],["describe","verb","/dɪˈskraɪb/","বর্ণনা করা","To say what something is like.","Describe the chart in your own words.","describe a process","General academic"],["significantly","adverb","/sɪɡˈnɪf.ɪ.kənt.li/","উল্লেখযোগ্যভাবে","By a large or important amount.","Prices rose significantly.","rise significantly","General academic"],["countable","adjective","/ˈkaʊn.tə.bəl/","গণনাযোগ্য","Can be counted: one book, two books.","“Chair” is a countable noun.","countable noun","Education"],["uncountable","adjective","/ʌnˈkaʊn.tə.bəl/","অগণনীয়","Cannot be counted as separate items.","“Water” is uncountable.","uncountable noun","Education"],["article","noun","/ˈɑː.tɪ.kəl/","নির্দেশক শব্দ (a/an/the)","The words a, an and the.","Use an article before a singular countable noun.","definite article","Education"],["singular","adjective","/ˈsɪŋ.ɡjə.lər/","একবচন","Only one.","“Student” is singular.","singular noun","Education"],["plural","adjective","/ˈplʊə.rəl/","বহুবচন","More than one.","“Students” is plural.","plural form","Education"],["specific","adjective","/spəˈsɪf.ɪk/","নির্দিষ্ট","Clear and particular, not general.","Use “the” for a specific thing.","specific example","General academic"],["general","adjective","/ˈdʒen.ər.əl/","সাধারণ","Not detailed or specific.","The report gives a general view.","in general","General academic"],["information","noun","/ˌɪn.fəˈmeɪ.ʃən/","তথ্য","Facts about something. It is uncountable.","This table gives useful information.","provide information","General academic"],["auxiliary","adjective","/ɔːɡˈzɪl.i.ər.i/","সহায়ক","A helping verb such as be, do or have.","“Does” is an auxiliary verb.","auxiliary verb","Education"],["agreement","noun","/əˈɡriː.mənt/","সামঞ্জস্য","When the verb matches the subject.","Check subject-verb agreement.","subject-verb agreement","Education"],["regular","adjective","/ˈreɡ.jə.lər/","নিয়মিত","Following the normal pattern.","“Walk” is a regular verb.","regular verb","General academic"],["irregular","adjective","/ɪˈreɡ.jə.lər/","অনিয়মিত","Not following the normal pattern.","“Go” is an irregular verb.","irregular verb","General academic"],["habit","noun","/ˈhæb.ɪt/","অভ্যাস","Something you do regularly.","Reading daily is a good habit.","develop a habit","General academic"],["frequently","adverb","/ˈfriː.kwənt.li/","বারবার","Often.","People frequently use phones.","used frequently","General academic"],["indicate","verb","/ˈɪn.dɪ.keɪt/","নির্দেশ করা","To show or point to something.","The results indicate a rise.","data indicate","General academic"],["require","verb","/rɪˈkwaɪər/","প্রয়োজন হওয়া","To need something.","This task requires careful planning.","require support","General academic"],["tense","noun","/tens/","কাল","The form of a verb that shows time.","Past simple is a tense.","past tense; present tense","Education"],["present","adjective","/ˈprez.ənt/","বর্তমান","Happening now.","Use the present simple for facts.","present tense","Education"],["future","noun","/ˈfjuː.tʃər/","ভবিষ্যৎ","The time after now.","Sales will rise in the future.","in the future","General academic"],["prediction","noun","/prɪˈdɪk.ʃən/","পূর্বাভাস","A statement about what will happen.","The chart gives a prediction for 2030.","make a prediction","General academic"],["increase","verb","/ɪnˈkriːs/","বৃদ্ধি পাওয়া","To become larger in number or amount.","Prices increased in 2020.","increase sharply","General academic"],["decrease","verb","/dɪˈkriːs/","হ্রাস পাওয়া","To become smaller in number or amount.","Use fell to decrease.","decrease slightly","General academic"],["recently","adverb","/ˈriː.sənt.li/","সম্প্রতি","Not long ago.","Recently, many people work online.","until recently","General academic"],["previously","adverb","/ˈpriː.vi.əs.li/","আগে","Before now.","Previously, prices were lower.","as previously stated","General academic"],["contrast","noun","/ˈkɒn.trɑːst/","বৈপরীত্য","A clear difference between two things.","There is a contrast between the two groups.","in contrast","General academic"],["reason","noun","/ˈriː.zən/","কারণ","Why something happens.","Give a reason for your opinion.","main reason","General academic"],["result","noun","/rɪˈzʌlt/","ফল","What happens because of something.","As a result, prices rose.","as a result","General academic"],["therefore","adverb","/ˈðeə.fɔːr/","সুতরাং","For that reason.","It was cheap; therefore, many bought it.","and therefore","General academic"],["however","adverb","/haʊˈev.ər/","তবে, তা সত্ত্বেও","Used to show a contrast.","However, sales fell in 2015.","However, + comma","General academic"],["although","conjunction","/ɔːlˈðəʊ/","যদিও","Used to show a contrast within one sentence.","Although it was cold, we went out.","although + clause","General academic"],["between","preposition","/bɪˈtwiːn/","মাঝে, মধ্যে","In the space or time separating two things.","Sales rose between 2005 and 2010.","between A and B","General academic"],["during","preposition","/ˈdjʊə.rɪŋ/","সময়কালে","Throughout a period of time.","Prices fell during the year.","during the period","General academic"]];

{q:"Which is a complete sentence?",o:["Runs in the park.","The student reads a book.","Because it was late.","The big red."],a:1,e:"It has a subject (The student), a verb (reads) and an object (a book). The others are missing a subject or a complete idea."},
{q:"What is the subject in “The teacher opened the window”?",o:["opened","the window","The teacher","window"],a:2,e:"Ask “Who opened?” → The teacher."},
{q:"What is the verb in “Rahim writes a letter every day”?",o:["Rahim","writes","a letter","every day"],a:1,e:"“Writes” is the action."},
{q:"Choose the correct word order.",o:["She tea drinks every morning.","She drinks tea every morning.","Drinks she tea every morning.","Tea she drinks every morning."],a:1,e:"English uses Subject + Verb + Object. Bangla often puts the verb last, so “She tea drinks” is a typical mistake."},
{q:"What is the object in “Nila bought a ticket”?",o:["Nila","bought","a ticket","Nila bought"],a:2,e:"Ask “Bought what?” → a ticket."},

{q:"Unscramble: the students / in the library / study",a:["The students study in the library","In the library the students study"],e:"Subject + verb, then place."},

const DAYS={2:{obj:["Name the 8 parts of speech.","Decide a word’s job from the sentence.","Avoid word-form mistakes (fluent/fluently, happy/happiness)."],tx:"<p>Every English word has a job, called its <b>part of speech</b>. Knowing the job helps you build correct sentences.</p><table><tr><th>Part</th><th>Job</th><th>Examples</th></tr><tr><td>Noun</td><td>person, place, thing, idea</td><td>student, Dhaka, happiness</td></tr><tr><td>Pronoun</td><td>replaces a noun</td><td>she, they, it</td></tr><tr><td>Verb</td><td>action or state</td><td>write, is, develop</td></tr><tr><td>Adjective</td><td>describes a noun</td><td>old, important</td></tr><tr><td>Adverb</td><td>describes a verb/adjective</td><td>quickly, very</td></tr><tr><td>Preposition</td><td>place, time, direction</td><td>in, on, at, to</td></tr><tr><td>Conjunction</td><td>joins ideas</td><td>and, but, because</td></tr><tr><td>Interjection</td><td>sudden feeling</td><td>Wow! Oh!</td></tr></table><p>Tip: a word can change job. “a run” (noun) / “to run” (verb). Check the job inside the sentence.</p>",bn:"ইংরেজিতে প্রতিটি শব্দের একটি কাজ আছে। Noun = বিশেষ্য, Pronoun = সর্বনাম, Verb = ক্রিয়া, Adjective = বিশেষণ, Adverb = ক্রিয়াবিশেষণ, Preposition = পদান্বয়ী অব্যয় (in, on, at), Conjunction = সংযোজক অব্যয় (and, but), Interjection = আবেগসূচক অব্যয় (Wow!)। একই শব্দ বাক্যে ভিন্ন কাজ করতে পারে, তাই বাক্যে শব্দের কাজ দেখো।",mist:["✗ She speaks fluent. → ✓ She speaks fluently. (a verb needs an adverb)","✗ He is very happiness. → ✓ He is very happy. (adjective, not noun)","✗ I am agree. → ✓ I agree. (“agree” is already a verb)"],ielts:"<b>Writing:</b> Task 1 needs verbs and adverbs (“rose sharply”); Task 2 needs nouns and adjectives. Wrong word forms lower Lexical Resource and Grammatical Accuracy. <b>Speaking:</b> correct word forms make you sound clearer.",vw:"adjective, adverb, preposition, conjunction, pronoun, category, describe, significantly",hw:"Copy 10 sentences from any English article. Label the part of speech of every word. Check unknown words in a dictionary and add them to your error log. Then write 5 sentences using “describe” and “significantly”."}};
Object.assign(DAYS,{3:{obj:["Tell countable from uncountable nouns.","Use a, an, the or no article correctly.","Choose the right pronoun."],tx:"<p><b>Countable</b> nouns can be counted: a book, two books. <b>Uncountable</b> nouns cannot: water, information, advice, homework, equipment, traffic. They have no plural and no “a”. Say “some information”, not “an information”.</p><p><b>a / an:</b> use <b>a</b> before a consonant <i>sound</i> (a book, a university) and <b>an</b> before a vowel <i>sound</i> (an apple, an hour).</p><p><b>the:</b> use for something specific or already known (“the report”, “the sun”). Use no article for general ideas: “Life is difficult.” “Students need advice.”</p><table><tr><th>Subject</th><th>Object</th><th>Possessive</th></tr><tr><td>I</td><td>me</td><td>my</td></tr><tr><td>he / she / it</td><td>him / her / it</td><td>his / her / its</td></tr><tr><td>we / they</td><td>us / them</td><td>our / their</td></tr></table>",bn:"বাংলায় a/an/the নেই, তাই ইংরেজিতে এগুলো বাদ পড়া সবচেয়ে সাধারণ ভুল। একবচন গণনাযোগ্য বিশেষ্যের আগে সাধারণত a/an/the লাগে। information, advice, homework-এর মতো শব্দ অগণনীয়: এগুলোর শেষে s হয় না। উচ্চারণের ধ্বনি দেখে a/an বাছো (an hour, a university)।",mist:["✗ informations → ✓ information","✗ She is doctor. → ✓ She is a doctor.","✗ The life is difficult. (general) → ✓ Life is difficult."],ielts:"<b>Writing:</b> article and plural errors are very common and reduce Grammatical Accuracy. Check every noun in Task 1 and Task 2. <b>Speaking:</b> use pronouns to avoid repeating names.",vw:"countable, uncountable, article, singular, plural, specific, general, information",hw:"Write 10 sentences with a, an, the or no article. Include 3 uncountable nouns. Then proofread yesterday’s homework for missing articles."},4:{obj:["Use be, do and have correctly.","Add -s/-es for he, she, it.","Make verbs agree with their subjects."],tx:"<p><b>Main verbs</b> show the action (work, study). <b>Helping (auxiliary) verbs</b> support them: <b>be</b> (am/is/are/was/were), <b>do</b> (do/does/did), <b>have</b> (have/has/had).</p><p><b>Present simple:</b> with he/she/it add -s or -es: “She works.” “He goes.” With I/you/we/they use the base form: “They work.”</p><p><b>Questions and negatives</b> use do/does + base verb: “Does she work?” “She does not work.” After does/doesn’t the verb stays in its base form.</p><p><b>Agreement:</b> “Tom and Sara are friends.” “Each of the students has a book.” “Everyone is ready.”</p>",bn:"বাংলায় ক্রিয়ার রূপ ব্যক্তি অনুযায়ী বদলায় (আমি যাই, সে যায়), কিন্তু ইংরেজিতে he/she/it-এর সঙ্গে বর্তমান কালে verb-এর শেষে s/es বসে। does বা doesn’t থাকলে মূল verb-এ s হয় না: “She doesn’t like tea.”",mist:["✗ He go to school. → ✓ He goes to school.","✗ She doesn’t likes tea. → ✓ She doesn’t like tea.","✗ The students is ready. → ✓ The students are ready."],ielts:"<b>Writing:</b> subject-verb agreement errors appear in almost every beginner essay (“The graph show…”). <b>Speaking:</b> practise “he/she works” aloud until it sounds natural.",vw:"auxiliary, agreement, regular, irregular, habit, frequently, indicate, require",hw:"Write 8 sentences about your family’s routines using he/she/it. Add 4 questions and 4 negatives with do/does. Underline every verb and check its ending."}});

5 pm, at night</td><td>a point: at the bus stop</td></tr><tr><td><b>on</b></td><td>days, dates: on Monday, on 5 May</td><td>a surface: on the table</td></tr><tr><td><b>in</b></td><td>months, years, parts of day: in May, in 2020, in the morning</td><td>inside: in the room, in Dhaka</td></tr></table><p>Movement: <b>to</b> (toward), <b>from</b>, <b>into</b>, <b>through</b>. Linking: <b>and</b> (add), <b>but</b> (contrast), <b>or</b> (choice), <b>so</b> (result), <b>because</b> + clause (reason). Use <b>because of</b> + noun: “because of the rain”.</p>",bn:"বাংলার “-এ/-তে” ইংরেজিতে at, on বা in হতে পারে: সোমবারে = on Monday, সকালে = in the morning, রাতে = at night। শব্দের আগে preposition বসে। because-এর পরে পূর্ণ বাক্য, because of-এর পরে noun।",mist:["✗ I was born at 2000. → ✓ I was born in 2000.","✗ She is good in English. → ✓ She is good at English.","✗ He stayed home because of it was raining. → ✓ …because it was raining. / …because of the rain."],ielts:"<b>Writing Task 1:</b> time phrases are essential (“in 2010”, “between 2000 and 2010”, “from 2005 to 2010”). <b>Both tasks:</b> linking words support Coherence and Cohesion. <b>Speaking:</b> because and but help you extend answers.",vw:"contrast, reason, result, therefore, however, although, between, during",hw:"Write 10 sentences using at, on and in (time and place). Then write 5 sentences using because, but, so, although and however. Check each preposition."}});

function day1(){return `
<div class="card"><h2>Objectives</h2><ul><li>Recognise a complete English sentence.</li><li>Find the subject, verb and object.</li><li>Use the order Subject + Verb + Object (S V O).</li><li>Avoid the Bangla-style order “I rice eat”.</li></ul><small>Quick revision: none needed. Start here.</small></div>
<div class="card"><h2>Lesson</h2><p>A <b>sentence</b> is a group of words that gives a complete idea. It needs a <b>subject</b> and a <b>verb</b>.</p><ul><li><b>Subject</b>: who or what does the action.</li><li><b>Verb</b>: the action or state.</li><li><b>Object</b>: who or what receives the action.</li></ul><p>Basic pattern: <b>S + V + O</b> → “Rahim <u>reads</u> a book.” Some sentences have no object: “Birds fly.” Place and time usually come last: “Nila studies English at home every evening.”</p>
<div class="bn"><b>বাংলায়:</b> ইংরেজিতে সাধারণ ক্রম হলো কর্তা → ক্রিয়া → কর্ম (S V O)। বাংলায় ক্রিয়া সাধারণত শেষে বসে (S O V): “আমি ভাত খাই।” ইংরেজিতে ক্রিয়া কর্মের আগে বসে: “I eat rice.” তাই “I rice eat” ভুল।</div></div>
<div class="card"><h2>Step-by-step example</h2><p>“The teacher opened the window.”</p><ol><li>Find the action: <b>opened</b> (verb).</li><li>Ask “Who opened?” → <b>The teacher</b> (subject).</li><li>Ask “Opened what?” → <b>the window</b> (object).</li></ol></div>
<div class="card"><h2>Common mistakes (Bangla speakers)</h2><ul><li>✗ I rice eat. → ✓ I eat rice.</li><li>✗ Is raining. → ✓ It is raining. (English needs a subject; Bangla often drops it.)</li><li>✗ Because I was tired. (incomplete idea) → ✓ I slept early because I was tired.</li></ul></div>
<div class="card"><h2>IELTS relevance</h2><p><b>Writing:</b> clear, accurate sentences support Grammatical Range and Accuracy. <b>Speaking:</b> answer in full sentences (“I like cycling because it is relaxing”), not single words. <b>Reading/Listening:</b> finding who did what helps you match answers.</p></div>
<div class="card"><h2>Guided practice</h2><p>“Sara reads a book every night.” → S: Sara · V: reads · O: a book · time: every night.</p><p>“Heavy rain caused floods in Sylhet.” → S: Heavy rain · V: caused · O: floods · place: in Sylhet.</p></div>
<div class="card"><h2>Practice quiz (answers appear after you check)</h2>${qhtml("d1")}<button data-a="check" data-id="d1">Check answers</button><div id="res" role="status"></div></div>
<div class="card"><h2>Vocabulary for today</h2><p>${V.map(v=>v[0]).join(", ")} — study them on the <a href="#vocab">Words</a> page.</p></div>
<div class="card"><h2>Homework</h2><p>Write 10 sentences about your daily routine in S V O order. Underline the subject, verb and object. Keep an error log of every mistake.</p><h2>Revision checklist</h2><label><input type="checkbox"> I can define sentence, subject, verb, object</label><br><label><input type="checkbox"> I can find S V O in a sentence</label><br><label><input type="checkbox"> I know why “I rice eat” is wrong</label></div>
<div class="card"><button data-a="done" data-n="1" id="dn" ${S.quiz.some(q=>q.id==="d1")?"":"disabled"}>${S.done[1]?"Completed ✓ (tap to undo)":"Mark Day 1 complete"}</button><br><small>Complete the quiz first; unfinished practice does not count.</small></div>`}
